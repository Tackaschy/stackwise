<style>
/* Layout: instrument workspace — library rail, sequence bench, fluid grid of analysis panes */
:root {
  --bg: #f3f4f8; --panel: #ffffff; --sunk: #eceef5; --line: #dcdfea; --line-strong: #c3c8d8;
  --fg: #1a1c27; --muted: #5d6275; --faint: #8a8fa3;
  --accent: #5b3fc4; --accent-soft: #ece8fb; --accent-fg: #ffffff;
  --ok: #2b8a3e; --ok-soft: #e3f4e6; --warn: #b26a00; --warn-soft: #fdf0d9; --bad: #c92a2a; --bad-soft: #fde4e4;
  --bA: #2b9a44; --bC: #1f6fd1; --bG: #1d1e24; --bT: #d42f2f;
  --pair: #8c92a8;
  --f-display: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --f-ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12131a; --panel: #1a1c25; --sunk: #14151d; --line: #2b2e3b; --line-strong: #3b3f50;
  --fg: #e7e8ef; --muted: #a2a6b8; --faint: #6f7489;
  --accent: #a995f5; --accent-soft: #2a2442; --accent-fg: #15121f;
  --ok: #69db7c; --ok-soft: #17301d; --warn: #f2b84b; --warn-soft: #33270f; --bad: #ff8787; --bad-soft: #3a1a1c;
  --bA: #5fd37a; --bC: #6aa8ff; --bG: #f0c95a; --bT: #ff7070; --pair: #6c7187; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12131a; --panel: #1a1c25; --sunk: #14151d; --line: #2b2e3b; --line-strong: #3b3f50;
  --fg: #e7e8ef; --muted: #a2a6b8; --faint: #6f7489;
  --accent: #a995f5; --accent-soft: #2a2442; --accent-fg: #15121f;
  --ok: #69db7c; --ok-soft: #17301d; --warn: #f2b84b; --warn-soft: #33270f; --bad: #ff8787; --bad-soft: #3a1a1c;
  --bA: #5fd37a; --bC: #6aa8ff; --bG: #f0c95a; --bT: #ff7070; --pair: #6c7187; color-scheme: dark }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-ui); font-size: 14px; line-height: 1.45; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { flex: none; }
.brand b { font-family: var(--f-display); font-size: 20px; letter-spacing: -0.01em; }
.brand span { color: var(--faint); font-size: 12px; }
.cond { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.field { display: flex; align-items: center; gap: 6px; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px 3px 9px; }
.field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; white-space: nowrap; }
.field input { width: 54px; border: 0; background: transparent; text-align: right; padding: 3px 0; font-family: var(--f-mono); font-size: 13px; }
.field input:focus { outline: none; }
.field:focus-within { border-color: var(--accent); }
.field i { font-style: normal; font-size: 11px; color: var(--faint); padding-right: 4px; }
.seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }

/* Shell */
.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; max-width: 1640px; margin: 0 auto; }
@media (max-width: 900px) { .shell { grid-template-columns: minmax(0, 1fr); } }

/* Library rail */
.rail { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rail-head { display: flex; align-items: center; justify-content: space-between; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.lib { display: flex; flex-direction: column; gap: 4px; max-height: 70vh; overflow: auto; }
@media (max-width: 900px) { .lib { flex-direction: row; overflow-x: auto; max-height: none; padding-bottom: 4px; } .lib .item { min-width: 190px; } }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: transparent; text-align: left; cursor: pointer; width: 100%; }
.item:hover { background: var(--panel); border-color: var(--line); }
.item[aria-current="true"] { background: var(--panel); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.item .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { grid-column: 2 / 4; font-family: var(--f-mono); font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role { font-family: var(--f-mono); font-size: 10px; font-weight: 700; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.role.F { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.role.R { background: var(--sunk); color: var(--fg); border-color: var(--line-strong); }
.tmchip { font-family: var(--f-mono); font-size: 11px; padding: 1px 6px; border-radius: 99px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--panel); padding: 6px 11px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--sunk); }
.btn.danger { color: var(--bad); }
.btn:focus-visible, .item:focus-visible, .seg button:focus-visible, .pane-h button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rail-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.note { font-size: 12px; color: var(--faint); }

/* Bench */
.main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.bench { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.bench-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.name-in { flex: 1 1 200px; min-width: 0; font-size: 18px; font-weight: 700; border: 0; background: transparent; padding: 2px 0; border-bottom: 1px dashed transparent; }
.name-in:hover, .name-in:focus { border-bottom-color: var(--line-strong); outline: none; }
.rolesel select { border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 5px 8px; font-size: 13px; }
textarea.seq { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); padding: 10px 12px; font-family: var(--f-mono); font-size: 14px; letter-spacing: 0.04em; line-height: 1.6; }
textarea.seq:focus { outline: none; border-color: var(--accent); }
.msg { font-size: 12px; color: var(--warn); }
.strip { font-family: var(--f-mono); font-size: 15px; line-height: 2.1; letter-spacing: 0.02em; display: flex; flex-wrap: wrap; gap: 0 14px; padding: 4px 2px 0; }
.blk { position: relative; white-space: nowrap; }
.blk::before { content: attr(data-pos); position: absolute; top: -12px; left: 0; font-size: 9px; color: var(--faint); letter-spacing: 0; line-height: 1; }
.bA { color: var(--bA); } .bC { color: var(--bC); } .bG { color: var(--bG); } .bT { color: var(--bT); }
.end3 { background: var(--accent-soft); border-radius: 3px; }
.ends { font-family: var(--f-mono); font-size: 11px; color: var(--faint); align-self: center; }

/* Metrics */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid var(--line); }
.m { padding: 10px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.m .k { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.m .v { font-family: var(--f-mono); font-size: 16px; font-weight: 600; white-space: nowrap; }
.m .v small { font-size: 11px; color: var(--faint); font-weight: 400; margin-left: 2px; }
.m.hero { grid-column: span 2; background: var(--accent-soft); }
.m.hero .v { font-family: var(--f-display); font-size: 30px; line-height: 1.1; color: var(--accent); }
.m.hero .v small { font-family: var(--f-ui); }
.counts span { margin-right: 6px; }

/* Panes */
.panes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 1180px) { .panes { grid-template-columns: minmax(0, 1fr); } }
.pane.wide { grid-column: 1 / -1; }
.pane.drag-over { outline: 2px dashed var(--accent); outline-offset: 2px; }
.pane-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 14px; border-bottom: 1px solid var(--line); }
.pane.closed .pane-h { border-bottom-color: transparent; }
.pane-h h2 { font-family: var(--f-display); font-size: 15px; margin: 0; font-weight: 700; }
.pane-h .grip { cursor: grab; color: var(--faint); display: grid; place-items: center; }
.pane-h .sum { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pane-h button { border: 0; background: transparent; color: var(--faint); cursor: pointer; padding: 4px; border-radius: 6px; display: grid; place-items: center; }
.pane-h button:hover { color: var(--fg); background: var(--sunk); }
.pane-b { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.pane.closed .pane-b { display: none; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.crit { background: var(--bad); color: var(--panel); }
.pill.neutral { background: var(--sunk); color: var(--muted); }

.struct { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.struct.ok { border-left: 3px solid var(--ok); } .struct.warn { border-left: 3px solid var(--warn); } .struct.bad { border-left: 3px solid var(--bad); } .struct.crit { border-left: 6px solid var(--bad); } .struct.crit .struct-h { background: var(--bad-soft); }
.struct-h { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 7px 10px; background: var(--sunk); font-size: 12px; color: var(--muted); }
.struct-h b { font-family: var(--f-mono); color: var(--fg); font-size: 13px; }
.duplex { font-family: var(--f-mono); font-size: 13px; line-height: 1.35; padding: 8px 10px; overflow-x: auto; white-space: pre; margin: 0; }
.duplex .pr { color: var(--pair); }
.duplex .lab { color: var(--faint); }
.duplex .hot { background: var(--bad-soft); border-radius: 2px; }
.empty { color: var(--muted); font-size: 13px; padding: 4px 0; }

table.kv { width: 100%; border-collapse: collapse; font-size: 13px; }
table.kv td { padding: 5px 0; border-bottom: 1px solid var(--line); }
table.kv td:last-child { text-align: right; font-family: var(--f-mono); }
table.kv tr:last-child td { border-bottom: 0; }

.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--f-mono); font-size: 10px; fill: var(--faint); }
.chart .ax { stroke: var(--line-strong); stroke-width: 1; }
.chart .grid { stroke: var(--line); stroke-width: 1; }

.checks { display: flex; flex-direction: column; }
.chk { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.chk:last-child { border-bottom: 0; }
.chk .d { color: var(--muted); font-size: 12px; }
.chk .val { font-family: var(--f-mono); font-size: 12px; text-align: right; }

.partner { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.partner select { border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 5px 8px; max-width: 100%; }

/* Modal */
.scrim { position: fixed; inset: 0; background: rgb(10 10 20 / 0.45); z-index: 50; display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(560px, 100%); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.dialog h3 { margin: 0; font-family: var(--f-display); }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 60; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
@media (prefers-reduced-motion: no-preference) { .pane, .struct { transition: border-color .15s; } }
</style>

<script>
(function () {
const S = window.Stackwise, St = window.StackwiseStruct;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fx = (v, d = 1) => (v == null || !isFinite(v)) ? '—' : (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d).replace('-', '−');
const store = {
  get(k, d) { try { const v = localStorage.getItem('stackwise:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('stackwise:' + k, JSON.stringify(v)); } catch (e) {} }
};
const uid = () => Math.random().toString(36).slice(2, 9);

const EXAMPLES = [
  { id: 'ex1', name: 'M13 forward (−20)', seq: 'GTAAAACGACGGCCAGT', role: 'F', ex: true },
  { id: 'ex2', name: 'M13 reverse', seq: 'CAGGAAACAGCTATGAC', role: 'R', ex: true },
  { id: 'ex3', name: 'T7 promoter', seq: 'TAATACGACTCACTATAGGG', role: 'F', ex: true },
  { id: 'ex4', name: 'Self-complementary test', seq: 'GCTAGCTTAGGCCTAAGC', role: '', ex: true }
];
let lib = store.get('lib', null) || EXAMPLES.slice();
let sel = store.get('sel', lib[0] && lib[0].id);
let partner = store.get('partner', null);
let cond = Object.assign({ na: 50, mg: 1.5, dntp: 0.2, oligo: 250, temp: 37, method: 'santalucia' }, store.get('cond', {}));
const PANES = [
  { id: 'melt', title: 'Melting & thermodynamics' },
  { id: 'checks', title: 'Primer checks' },
  { id: 'hairpin', title: 'Hairpins' },
  { id: 'self', title: 'Self-dimers' },
  { id: 'cross', title: 'Cross-dimer & pair' },
  { id: 'stab', title: '3′ stability profile' }
];
let order = store.get('order', PANES.map(p => p.id)).filter(id => PANES.some(p => p.id === id));
PANES.forEach(p => { if (!order.includes(p.id)) order.push(p.id); });
let closed = new Set(store.get('closed', []));
let wide = new Set(store.get('wide', ['stab']));
const save = () => { store.set('lib', lib); store.set('sel', sel); store.set('partner', partner); store.set('cond', cond); store.set('order', order); store.set('closed', [...closed]); store.set('wide', [...wide]); };
const cur = () => lib.find(o => o.id === sel) || lib[0];

/* ---------- severity rules ---------- */
const rateStruct = (dG, end3, kind) => {
  const lim = kind === 'hairpin' ? (end3 ? [-2, -4] : [-3, -6]) : (end3 ? [-5, -8] : [-6, -9]);
  return dG > lim[0] ? 'ok' : dG > lim[1] ? 'warn' : 'bad';
};
const tmClass = tm => tm >= 52 && tm <= 65 ? 'ok' : tm >= 45 && tm <= 72 ? 'warn' : 'bad';

/* ---------- coloured sequence ---------- */
const colorBase = b => `<span class="b${b}">${b}</span>`;
function strip(seq) {
  if (!seq) return '<span class="note">No sequence yet.</span>';
  let h = '';
  for (let i = 0; i < seq.length; i += 10) {
    const chunk = seq.slice(i, i + 10);
    let inner = '';
    for (let k = 0; k < chunk.length; k++) {
      const p = i + k;
      inner += p >= seq.length - 5 ? `<span class="end3">${colorBase(chunk[k])}</span>` : colorBase(chunk[k]);
    }
    h += `<span class="blk" data-pos="${i + 1}">${inner}</span>`;
  }
  return h;
}

/* ---------- duplex text rendering ---------- */
// top: 5'→3' string; bot: string written 3'→5'; pairs: [[i,j]] ascending; hot: sets of indices at 3' ends
function duplexHTML(top, bot, pairs, opts = {}) {
  const T = [], B = [], M = [];
  const push = (t, b, m, ti, bi) => { T.push([t, ti]); B.push([b, bi]); M.push(m); };
  const [i0, j0] = pairs[0];
  const lead = Math.max(i0, j0);
  for (let k = 0; k < lead; k++) {
    const ti = k - (lead - i0), bi = k - (lead - j0);
    push(ti >= 0 ? top[ti] : ' ', bi >= 0 ? bot[bi] : ' ', ' ', ti >= 0 ? ti : -1, bi >= 0 ? bi : -1);
  }
  for (let k = 0; k < pairs.length; k++) {
    const [i, j] = pairs[k];
    if (k > 0) {
      const [p, q] = pairs[k - 1], a = i - p - 1, b = j - q - 1, w = Math.max(a, b);
      for (let x = 0; x < w; x++) push(x < a ? top[p + 1 + x] : '-', x < b ? bot[q + 1 + x] : '-', ' ', x < a ? p + 1 + x : -1, x < b ? q + 1 + x : -1);
    }
    push(top[i], bot[j], '|', i, j);
  }
  const [iN, jN] = pairs[pairs.length - 1];
  if (opts.loop) {
    const lp = opts.loop, half = Math.ceil(lp.length / 2);
    for (let x = 0; x < half; x++) push(lp[x] || ' ', lp[lp.length - 1 - x] && (lp.length - 1 - x) >= half ? lp[lp.length - 1 - x] : ' ', ' ', -2, -2);
  } else {
    const ta = top.length - 1 - iN, tb = bot.length - 1 - jN, w = Math.max(ta, tb);
    for (let x = 0; x < w; x++) push(x < ta ? top[iN + 1 + x] : ' ', x < tb ? bot[jN + 1 + x] : ' ', ' ', x < ta ? iN + 1 + x : -1, x < tb ? jN + 1 + x : -1);
  }
  const cell = ([c, idx], hot) => c === ' ' || c === '-' ? `<span class="lab">${c}</span>` : `<span class="b${c}${hot && hot.has(idx) ? ' hot' : ''}">${c}</span>`;
  const L = opts.labels || ['5′', '3′', '3′', '5′'];
  const tail = opts.loop ? [' ╮', ' │', ' ╯'] : [' ' + L[1], '', ' ' + L[3]];
  return `<pre class="duplex"><span class="lab">${L[0]} </span>${T.map(c => cell(c, opts.hotTop)).join('')}<span class="lab">${tail[0]}</span>\n<span class="lab">   </span><span class="pr">${M.join('')}</span><span class="lab">${tail[1]}</span>\n<span class="lab">${L[2]} </span>${B.map(c => cell(c, opts.hotBot)).join('')}<span class="lab">${tail[2]}</span></pre>`;
}

function dimerCard(d, A, B, kind) {
  const st = rateStruct(d.dG, d.end3A || d.end3B, kind);
  const Y = B.split('').reverse().join('');
  const hotTop = new Set([A.length - 1, A.length - 2, A.length - 3]);
  const hotBot = new Set([0, 1, 2]);
  const bp = d.pairs.length;
  const flags = [];
  if (d.end3A) flags.push(kind === 'self' ? '3′ end' : '3′ of this oligo');
  if (d.end3B && kind !== 'self') flags.push('3′ of partner');
  return `<div class="struct ${st}"><div class="struct-h"><span>ΔG <b>${fx(d.dG, 2)}</b> kcal/mol</span><span>ΔH <b>${fx(d.dH, 1)}</b></span><span>ΔS <b>${fx(d.dS, 1)}</b></span><span>${bp} bp</span>${flags.map(f => `<span class="pill bad">${f}</span>`).join('')}<span class="pill ${st}" style="margin-left:auto">${st === 'ok' ? 'Negligible' : st === 'warn' ? 'Moderate' : 'Strong'}</span></div>${duplexHTML(A, Y, d.pairs, { hotTop, hotBot })}</div>`;
}

function hairpinCard(h, s) {
  const st = rateStruct(h.dG, h.end3, 'hairpin');
  const n = s.length, Y = s.split('').reverse().join('');
  const pairs = h.pairs.map(([i, j]) => [i, n - 1 - j]);
  const [iK, jK] = h.pairs[h.pairs.length - 1];
  const loop = s.slice(iK + 1, jK);
  const hotBot = new Set([0, 1, 2]);
  return `<div class="struct ${st}"><div class="struct-h"><span>ΔG <b>${fx(h.dG, 2)}</b> kcal/mol</span><span>Tm <b>${fx(h.tm, 1)}</b> °C</span><span>${h.pairs.length} bp stem · ${loop.length} nt loop</span>${h.end3 ? '<span class="pill bad">3′ end in stem</span>' : ''}<span class="pill ${st}" style="margin-left:auto">${st === 'ok' ? 'Negligible' : st === 'warn' ? 'Moderate' : 'Strong'}</span></div>${duplexHTML(s.slice(0, iK + 1), Y.slice(0, n - jK), pairs, { loop, hotBot, labels: ['5′', '', '3′', ''] })}</div>`;
}

/* ---------- charts ---------- */
function meltChart(seq, th) {
  const W = 520, H = 220, l = 40, r = 14, t = 14, b = 30;
  const t0 = Math.floor((th.tmSL - 30) / 5) * 5, t1 = t0 + 60;
  const pts = S.meltCurve(seq, cond, t0, t1, 0.5);
  const X = v => l + (v - t0) / (t1 - t0) * (W - l - r), Yv = v => t + (1 - v) * (H - t - b);
  let grid = '';
  for (let v = 0; v <= 1.0001; v += 0.25) grid += `<line class="grid" x1="${l}" x2="${W - r}" y1="${Yv(v)}" y2="${Yv(v)}"/><text x="${l - 6}" y="${Yv(v) + 3}" text-anchor="end">${Math.round(v * 100)}</text>`;
  for (let v = t0; v <= t1; v += 10) grid += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${t}" y2="${H - b}"/><text x="${X(v)}" y="${H - b + 14}" text-anchor="middle">${v}</text>`;
  const path = pts.map(([x, y], k) => (k ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Yv(y).toFixed(1)).join('');
  const area = path + `L${X(t1)} ${Yv(0)}L${X(t0)} ${Yv(0)}Z`;
  const tmx = X(th.tm);
  const showT = th.tm >= t0 && th.tm <= t1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fraction of oligo in duplex versus temperature">
    ${grid}<line class="ax" x1="${l}" x2="${W - r}" y1="${H - b}" y2="${H - b}"/>
    <path d="${area}" fill="var(--accent)" fill-opacity="0.10"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${showT ? `<line x1="${tmx}" x2="${tmx}" y1="${t}" y2="${H - b}" stroke="var(--fg)" stroke-dasharray="3 3" stroke-width="1"/><circle cx="${tmx}" cy="${Yv(0.5)}" r="4" fill="var(--panel)" stroke="var(--fg)" stroke-width="1.5"/><text x="${tmx + 7}" y="${t + 10}" style="fill:var(--fg)">Tm ${fx(th.tm, 1)} °C</text>` : ''}
    <text x="${l}" y="${H - 4}">°C</text><text x="4" y="${t + 4}">% duplex</text>
  </svg>`;
}

function stabChart(seq) {
  const w = S.windows(seq, cond, 5);
  if (!w.length) return '<p class="empty">Needs at least 5 nt.</p>';
  const W = Math.max(360, w.length * 14 + 60), H = 200, l = 40, r = 10, t = 12, b = 26;
  const minG = Math.min(-10, ...w) , Yv = v => t + (v / minG) * (H - t - b);
  const bw = (W - l - r) / w.length;
  let g = '';
  for (let v = 0; v >= minG - 0.01; v -= 2) g += `<line class="grid" x1="${l}" x2="${W - r}" y1="${Yv(v)}" y2="${Yv(v)}"/><text x="${l - 6}" y="${Yv(v) + 3}" text-anchor="end">${fx(v, 0)}</text>`;
  const bars = w.map((v, k) => {
    const last = k === w.length - 1;
    const col = v < -9 ? 'var(--bad)' : v < -7 ? 'var(--warn)' : 'var(--accent)';
    return `<rect x="${(l + k * bw + 1.5).toFixed(1)}" y="${Yv(0)}" width="${Math.max(2, bw - 3).toFixed(1)}" height="${(Yv(v) - Yv(0)).toFixed(1)}" rx="2" fill="${col}" fill-opacity="${last ? 1 : 0.55}"><title>${k + 1}–${k + 5}: ${seq.substr(k, 5)} ΔG ${fx(v, 2)} kcal/mol</title></rect>`;
  }).join('');
  const ticks = w.map((v, k) => (k % 5 === 0 || k === w.length - 1) ? `<text x="${l + k * bw + bw / 2}" y="${H - b + 14}" text-anchor="middle">${k + 1}</text>` : '').join('');
  const lim = `<line x1="${l}" x2="${W - r}" y1="${Yv(-9)}" y2="${Yv(-9)}" stroke="var(--bad)" stroke-dasharray="4 3"/><text x="${W - r}" y="${Yv(-9) - 4}" text-anchor="end" style="fill:var(--bad)">−9 limit</text>`;
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W, 560)}px" role="img" aria-label="Pentamer duplex stability along the sequence">${g}${bars}${lim}<line class="ax" x1="${l}" x2="${W - r}" y1="${Yv(0)}" y2="${Yv(0)}"/>${ticks}</svg></div>`;
}

/* ---------- analysis ---------- */
const STRUCT_MAX = 160;
function analyze(o) {
  const seq = o.seq, res = { seq };
  if (seq.length < 2) return res;
  res.th = S.thermo(seq, cond);
  res.alt = S.thermo(seq, Object.assign({}, cond, { method: cond.method === 'santalucia' ? 'owczarzy' : 'santalucia' }));
  res.ph = S.physical(seq);
  res.basic = S.basicTm(seq);
  res.win = S.windows(seq, cond, 5);
  res.rep = S.repeats(seq);
  if (seq.length <= STRUCT_MAX) {
    res.hp = St.hairpin(seq, cond, { limit: 4 });
    res.sd = St.dimer(seq, seq, cond, { limit: 4 });
  }
  return res;
}

function checks(o, r) {
  const s = o.seq, out = [];
  const add = (st, name, detail, val) => out.push({ st, name, detail, val });
  const n = s.length;
  add(n >= 18 && n <= 30 ? 'ok' : n >= 15 && n <= 35 ? 'warn' : 'bad', 'Length', '18–30 nt for PCR primers', n + ' nt');
  const gc = r.ph.gc;
  add(gc >= 40 && gc <= 60 ? 'ok' : gc >= 30 && gc <= 70 ? 'warn' : 'bad', 'GC content', '40–60 %', fx(gc, 1) + ' %');
  add(tmClass(r.th.tm), 'Melting temperature', '52–65 °C (nearest-neighbor)', fx(r.th.tm, 1) + ' °C');
  const last5 = s.slice(-5), gc5 = (last5.match(/[GC]/g) || []).length, endGC = /[GC]$/.test(s);
  add(gc5 > 3 ? 'warn' : endGC ? 'ok' : 'warn', 'GC clamp', 'G or C at the 3′ end, at most 3 G/C in the last 5', `${gc5}/5, ends ${s.slice(-1)}`);
  const w3 = r.win.length ? r.win[r.win.length - 1] : 0;
  add(w3 > -9 ? 'ok' : 'warn', '3′ end stability', 'ΔG of the 3′ pentamer above −9 kcal/mol', fx(w3, 2));
  add(r.rep.runs.length ? 'warn' : 'ok', 'Single-base runs', 'No run of 4 or more of one base', r.rep.runs.length ? r.rep.runs.map(x => x.seq).join(', ') : 'none');
  add(r.rep.di.length ? 'warn' : 'ok', 'Dinucleotide repeats', 'No dinucleotide repeated 4 or more times', r.rep.di.length ? r.rep.di.map(x => x.seq).join(', ') : 'none');
  if (r.hp) { const h = r.hp[0]; add(h ? rateStruct(h.dG, h.end3, 'hairpin') : 'ok', 'Hairpins', 'ΔG above −2 (3′) / −3 kcal/mol (internal)', h ? fx(h.dG, 2) : 'none'); }
  if (r.sd) { const d = r.sd[0]; add(d ? rateStruct(d.dG, d.end3A || d.end3B, 'self') : 'ok', 'Self-dimers', 'ΔG above −5 (3′) / −6 kcal/mol (internal)', d ? fx(d.dG, 2) : 'none'); }
  return out;
}

/* ---------- rendering ---------- */
function renderLib() {
  $('lib').innerHTML = lib.map(o => {
    const th = o.seq.length >= 2 ? S.thermo(o.seq, cond) : null;
    const tc = th ? tmClass(th.tm) : 'neutral';
    return `<button class="item" role="option" aria-current="${o.id === sel}" data-id="${o.id}">
      <span class="role ${o.role || ''}">${o.role || '·'}</span><span class="nm">${esc(o.name || 'Untitled')}</span>
      <span class="tmchip num pill ${tc}">${th ? fx(th.tm, 1) + '°' : '—'}</span>
      <span class="sub">${o.ex ? 'ex · ' : ''}${o.seq.length} nt · ${esc(o.seq.slice(0, 22))}${o.seq.length > 22 ? '…' : ''}</span></button>`;
  }).join('');
  $('lib-count').textContent = lib.length + (lib.length === 1 ? ' oligo' : ' oligos');
}

function renderMetrics(r) {
  if (!r.th) { $('metrics').innerHTML = '<div class="m"><div class="k">Enter at least 2 nt</div></div>'; return; }
  const ph = r.ph, th = r.th, c = ph.counts;
  const m = (k, v, u = '', cls = '') => `<div class="m ${cls}"><div class="k">${k}</div><div class="v num">${v}${u ? `<small>${u}</small>` : ''}</div></div>`;
  $('metrics').innerHTML =
    m(`Tm · ${cond.method === 'owczarzy' ? 'Owczarzy' : 'SantaLucia'}`, fx(th.tm, 1), '°C', 'hero') +
    m('Length', ph.n, 'nt') + m('GC', fx(ph.gc, 1), '%') +
    m(`ΔG ${cond.temp}°`, fx(th.dG, 2), 'kcal/mol') + m('ΔH', fx(th.dH, 1), 'kcal/mol') + m('ΔS', fx(th.dS, 1), 'cal/K·mol') +
    m('MW', ph.mw.toFixed(1), 'g/mol') + m('ε260', Math.round(ph.eps).toLocaleString('en-US'), 'L/mol·cm') +
    m('nmol / OD', fx(ph.nmolPerOD, 2)) + m('µg / OD', fx(ph.ugPerOD, 2)) +
    `<div class="m"><div class="k">Composition</div><div class="v num counts" style="font-size:13px"><span class="bA">A${c.A}</span><span class="bC">C${c.C}</span><span class="bG">G${c.G}</span><span class="bT">T${c.T}</span></div></div>`;
}

function paneBody(id, o, r) {
  if (!r.th) return '<p class="empty">Enter a sequence to analyze.</p>';
  const tooLong = o.seq.length > STRUCT_MAX ? `<p class="empty">Structure search runs on sequences up to ${STRUCT_MAX} nt.</p>` : '';
  if (id === 'melt') {
    const th = r.th, alt = r.alt;
    const other = cond.method === 'santalucia' ? 'Owczarzy' : 'SantaLucia';
    return meltChart(o.seq, th) + `<table class="kv">
      <tr><td>Tm, ${cond.method === 'santalucia' ? 'SantaLucia 1998 salt correction' : 'Owczarzy 2004/2008 salt correction'}</td><td>${fx(th.tm, 2)} °C</td></tr>
      <tr><td>Tm, ${other} salt correction</td><td>${fx(alt.tm, 2)} °C</td></tr>
      <tr><td>Tm, basic (Wallace / GC formula)</td><td>${fx(r.basic, 1)} °C</td></tr>
      <tr><td>ΔH° (nearest-neighbor sum)</td><td>${fx(th.dH, 1)} kcal/mol</td></tr>
      <tr><td>ΔS° (1 M NaCl → salt-corrected)</td><td>${fx(th.dS1M, 1)} → ${fx(th.dS, 1)} cal/K·mol</td></tr>
      <tr><td>ΔG° at ${cond.temp} °C</td><td>${fx(th.dG, 2)} kcal/mol</td></tr>
      <tr><td>ΔG° at 37 °C</td><td>${fx(th.dG37, 2)} kcal/mol</td></tr>
      <tr><td>Equivalent Na⁺ (Na⁺ + 120·√free Mg²⁺)</td><td>${fx(S.naEqM(cond) * 1000, 1)} mM</td></tr>
      <tr><td>Self-complementary</td><td>${th.sym ? 'yes (Ct used, not Ct/4)' : 'no'}</td></tr></table>`;
  }
  if (id === 'checks') {
    const cs = checks(o, r);
    return `<div class="checks">${cs.map(c => `<div class="chk"><span class="pill ${c.st}">${c.st === 'ok' ? 'Pass' : c.st === 'warn' ? 'Check' : 'Fail'}</span><div><div>${c.name}</div><div class="d">${c.detail}</div></div><div class="val">${esc(c.val)}</div></div>`).join('')}</div>`;
  }
  if (id === 'hairpin') {
    if (!r.hp) return tooLong;
    if (!r.hp.length) return '<p class="empty">No hairpin with a stem of 2 bp or more and a loop of 3 nt or more.</p>';
    return r.hp.map(h => hairpinCard(h, o.seq)).join('');
  }
  if (id === 'self') {
    if (!r.sd) return tooLong;
    if (!r.sd.length) return '<p class="empty">No self-dimer found.</p>';
    return r.sd.map(d => dimerCard(d, o.seq, o.seq, 'self')).join('');
  }
  if (id === 'cross') {
    const others = lib.filter(x => x.id !== o.id && x.seq.length >= 2);
    if (!others.length) return '<p class="empty">Add a second oligo to the library to check a primer pair.</p>';
    let p = others.find(x => x.id === partner);
    if (!p) p = others.find(x => o.role === 'F' ? x.role === 'R' : o.role === 'R' ? x.role === 'F' : false) || others[0];
    const opts = others.map(x => `<option value="${x.id}" ${x.id === p.id ? 'selected' : ''}>${esc(x.name || 'Untitled')} (${x.seq.length} nt)</option>`).join('');
    const pt = S.thermo(p.seq, cond), dTm = Math.abs(r.th.tm - pt.tm);
    let body = `<div class="partner"><label class="eyebrow" for="partner">Partner</label><select id="partner">${opts}</select>
      <span class="pill ${dTm <= 2 ? 'ok' : dTm <= 5 ? 'warn' : 'bad'}">ΔTm ${fx(dTm, 1)} °C</span>
      <span class="note">${fx(r.th.tm, 1)} vs ${fx(pt.tm, 1)} °C</span></div>`;
    if (o.seq.length > STRUCT_MAX || p.seq.length > STRUCT_MAX) return body + tooLong;
    const cd = St.dimer(o.seq, p.seq, cond, { limit: 4 });
    body += cd.length ? cd.map(d => dimerCard(d, o.seq, p.seq, 'cross')).join('') : '<p class="empty">No cross-dimer found.</p>';
    return body;
  }
  if (id === 'stab') {
    return `<p class="note" style="margin:0">ΔG of each 5-nt window paired with its complement, at ${cond.temp} °C. The solid bar is the 3′ pentamer; a very stable 3′ end raises the risk of mispriming.</p>` + stabChart(o.seq);
  }
  return '';
}

function paneSummary(id, r) {
  if (!r.th) return '';
  const pill = (st, t) => `<span class="pill ${st}">${t}</span>`;
  if (id === 'melt') return pill(tmClass(r.th.tm), 'Tm ' + fx(r.th.tm, 1) + ' °C');
  if (id === 'checks') { const cs = checks(cur(), r), w = cs.filter(c => c.st !== 'ok').length; return pill(w ? (cs.some(c => c.st === 'bad') ? 'bad' : 'warn') : 'ok', w ? w + ' to review' : 'All pass'); }
  if (id === 'hairpin' && r.hp) { const h = r.hp[0]; return h ? pill(rateStruct(h.dG, h.end3, 'hairpin'), fx(h.dG, 2)) : pill('ok', 'none'); }
  if (id === 'self' && r.sd) { const d = r.sd[0]; return d ? pill(rateStruct(d.dG, d.end3A || d.end3B, 'self'), fx(d.dG, 2)) : pill('ok', 'none'); }
  if (id === 'stab' && r.win.length) { const v = r.win[r.win.length - 1]; return pill(v > -9 ? 'ok' : 'warn', '3′ ' + fx(v, 2)); }
  return '';
}

const ICON = {
  grip: '<svg width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="3" r="1.4"/><circle cx="9" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="9" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="9" cy="13" r="1.4"/></g></svg>',
  wide: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12M2 8l3-3M2 8l3 3M14 8l-3-3M14 8l-3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  fold: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  unfold: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
};

let lastRes = null;
function renderPanes(o, r) {
  const host = $('panes');
  const scroll = window.scrollY;
  host.innerHTML = order.map(id => {
    const p = PANES.find(x => x.id === id), c = closed.has(id), w = wide.has(id);
    return `<section class="card pane ${c ? 'closed' : ''} ${w ? 'wide' : ''}" data-pane="${id}">
      <div class="pane-h"><span class="grip" draggable="true" title="Drag to reorder">${ICON.grip}</span><h2>${p.title}</h2>
        <span class="sum">${paneSummary(id, r)}</span>
        <button data-act="wide" aria-pressed="${w}" title="${w ? 'Half width' : 'Full width'}" aria-label="Toggle width">${ICON.wide}</button>
        <button data-act="fold" aria-expanded="${!c}" aria-label="${c ? 'Expand' : 'Collapse'} ${p.title}">${c ? ICON.unfold : ICON.fold}</button></div>
      <div class="pane-b">${c ? '' : paneBody(id, o, r)}</div></section>`;
  }).join('');
  try { window.scrollTo(0, scroll); } catch (e) {}
}

function renderAll(syncInputs) {
  const o = cur();
  if (!o) return;
  if (syncInputs) { $('name').value = o.name; $('seq').value = o.seq; $('role').value = o.role || ''; }
  $('del').textContent = 'Delete'; $('del').dataset.armed = '';
  $('strip').innerHTML = strip(o.seq);
  const r = analyze(o);
  lastRes = r;
  renderMetrics(r);
  renderPanes(o, r);
  renderLib();
}

/* ---------- events ---------- */
let timer = null;
const schedule = () => { clearTimeout(timer); timer = setTimeout(() => { save(); renderAll(false); }, 90); };

$('seq').addEventListener('input', e => {
  const raw = e.target.value;
  const body = raw.split('\n').filter(l => !l.startsWith('>')).join('');
  const bad = body.toUpperCase().replace(/[\sACGTU0-9]/g, '');
  const o = cur(); o.seq = S.clean(body); delete o.ex;
  const fa = raw.match(/^>(.+)$/m); if (fa && (!o.name || o.name === 'New oligo')) { o.name = fa[1].trim(); $('name').value = o.name; }
  const msg = $('msg');
  if (bad) { msg.hidden = false; msg.textContent = `Ignored ${bad.length} character${bad.length > 1 ? 's' : ''} (${[...new Set(bad)].slice(0, 8).join(' ')}). Only A, C, G, T and U are analyzed; degenerate IUPAC bases are not supported yet.`; }
  else msg.hidden = true;
  schedule();
});
$('name').addEventListener('input', e => { cur().name = e.target.value; schedule(); });
$('role').addEventListener('change', e => { cur().role = e.target.value; schedule(); });

function setSeq(fn) { const o = cur(); o.seq = fn(o.seq); delete o.ex; $('seq').value = o.seq; save(); renderAll(false); }
$('rc').onclick = () => setSeq(S.revcomp);
$('comp').onclick = () => setSeq(s => S.revcomp(s).split('').reverse().join(''));
$('rev').onclick = () => setSeq(s => s.split('').reverse().join(''));

function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1800); }
async function copy(text, done) {
  try { await navigator.clipboard.writeText(text); toast(done); }
  catch (e) { const ta = $('imp-txt'); $('imp').hidden = false; $('imp-t').textContent = 'Copy this text'; ta.value = text; ta.select(); $('imp-go').hidden = true; }
}
$('copyseq').onclick = () => copy(cur().seq, 'Sequence copied');
$('export').onclick = () => copy(lib.map(o => `>${o.name || 'Untitled'}\n${o.seq}`).join('\n'), 'Library copied as FASTA');
$('report').onclick = () => {
  const o = cur(), r = lastRes; if (!r || !r.th) return;
  const L = [`${o.name} (${o.seq.length} nt)`, `5'-${o.seq}-3'`, '',
    `Conditions: Na+ ${cond.na} mM, Mg2+ ${cond.mg} mM, dNTP ${cond.dntp} mM, oligo ${cond.oligo} nM; ${cond.method === 'owczarzy' ? 'Owczarzy' : 'SantaLucia'} salt correction`,
    `Tm ${fx(r.th.tm, 1)} °C | GC ${fx(r.ph.gc, 1)} % | ΔG(${cond.temp} °C) ${fx(r.th.dG, 2)} kcal/mol | ΔH ${fx(r.th.dH, 1)} kcal/mol | ΔS ${fx(r.th.dS, 1)} cal/K·mol`,
    `MW ${r.ph.mw.toFixed(1)} g/mol | ε260 ${Math.round(r.ph.eps)} L/mol·cm | ${fx(r.ph.nmolPerOD, 2)} nmol/OD | ${fx(r.ph.ugPerOD, 2)} µg/OD`];
  if (r.hp) L.push(`Strongest hairpin: ${r.hp[0] ? fx(r.hp[0].dG, 2) + ' kcal/mol' : 'none'}`);
  if (r.sd) L.push(`Strongest self-dimer: ${r.sd[0] ? fx(r.sd[0].dG, 2) + ' kcal/mol' : 'none'}`);
  L.push('', 'Checks:'); checks(o, r).forEach(c => L.push(`  [${c.st === 'ok' ? 'pass' : c.st === 'warn' ? 'check' : 'fail'}] ${c.name}: ${c.val}`));
  copy(L.join('\n'), 'Report copied');
};
$('del').onclick = e => {
  const b = e.currentTarget;
  if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Confirm delete'; return; }
  lib = lib.filter(o => o.id !== sel);
  if (!lib.length) lib.push({ id: uid(), name: 'New oligo', seq: '', role: 'F' });
  sel = lib[0].id; save(); renderAll(true);
};
$('new').onclick = () => { const o = { id: uid(), name: 'New oligo', seq: '', role: 'F' }; lib.unshift(o); sel = o.id; save(); renderAll(true); $('seq').focus(); };
$('lib').addEventListener('click', e => { const it = e.target.closest('.item'); if (!it) return; sel = it.dataset.id; save(); renderAll(true); });

$('import').onclick = () => { $('imp-t').textContent = 'Import oligos'; $('imp-go').hidden = false; $('imp').hidden = false; $('imp-txt').value = ''; $('imp-txt').focus(); };
$('imp-x').onclick = () => $('imp').hidden = true;
$('imp').addEventListener('click', e => { if (e.target.id === 'imp') $('imp').hidden = true; });
$('imp-go').onclick = () => {
  const txt = $('imp-txt').value.trim(); if (!txt) return;
  const added = [];
  if (txt.includes('>')) {
    txt.split('>').filter(Boolean).forEach(rec => { const [h, ...rest] = rec.split('\n'); const s = S.clean(rest.join('')); if (s) added.push({ id: uid(), name: h.trim() || 'Imported', seq: s, role: '' }); });
  } else txt.split('\n').map(l => l.trim()).filter(Boolean).forEach((l, k) => { const parts = l.split(/[\t,;]+/); const s = S.clean(parts[parts.length - 1]); if (s) added.push({ id: uid(), name: parts.length > 1 ? parts[0] : 'Oligo ' + (lib.length + k + 1), seq: s, role: '' }); });
  added.forEach(o => { if (/(^|[\s_-])(f|fw|fwd|forward)$/i.test(o.name)) o.role = 'F'; else if (/(^|[\s_-])(r|rv|rev|reverse)$/i.test(o.name)) o.role = 'R'; });
  if (!added.length) { toast('No sequences found'); return; }
  lib = added.concat(lib); sel = added[0].id; $('imp').hidden = true; save(); renderAll(true); toast(`Added ${added.length} oligo${added.length > 1 ? 's' : ''}`);
};

// conditions
const CF = { na: 'c-na', mg: 'c-mg', dntp: 'c-dntp', oligo: 'c-oligo', temp: 'c-temp' };
Object.entries(CF).forEach(([k, id]) => {
  $(id).value = cond[k];
  $(id).addEventListener('input', e => { const v = parseFloat(e.target.value); if (isFinite(v) && (k === 'temp' || v >= 0)) { cond[k] = k === 'oligo' ? Math.max(v, 0.001) : v; schedule(); } });
});
const setMethod = m => { cond.method = m; $('m-sl').setAttribute('aria-pressed', m === 'santalucia'); $('m-ow').setAttribute('aria-pressed', m === 'owczarzy'); };
setMethod(cond.method);
$('m-sl').onclick = () => { setMethod('santalucia'); schedule(); };
$('m-ow').onclick = () => { setMethod('owczarzy'); schedule(); };

// panes: fold, widen, partner, drag-reorder
$('panes').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = b.closest('.pane').dataset.pane;
  if (b.dataset.act === 'fold') closed.has(id) ? closed.delete(id) : closed.add(id);
  else wide.has(id) ? wide.delete(id) : wide.add(id);
  save(); renderPanes(cur(), lastRes);
});
$('panes').addEventListener('change', e => { if (e.target.id === 'partner') { partner = e.target.value; save(); renderPanes(cur(), lastRes); } });
let dragId = null;
$('panes').addEventListener('dragstart', e => { const p = e.target.closest('.pane'); if (!p) return; dragId = p.dataset.pane; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.setDragImage(p, 20, 20); } catch (x) {} });
$('panes').addEventListener('dragover', e => { const p = e.target.closest('.pane'); if (!p || !dragId) return; e.preventDefault(); document.querySelectorAll('.pane.drag-over').forEach(x => x !== p && x.classList.remove('drag-over')); p.classList.add('drag-over'); });
$('panes').addEventListener('drop', e => {
  const p = e.target.closest('.pane'); if (!p || !dragId) return; e.preventDefault();
  const to = p.dataset.pane; if (to !== dragId) { order = order.filter(x => x !== dragId); order.splice(order.indexOf(to), 0, dragId); save(); }
  dragId = null; renderPanes(cur(), lastRes);
});
$('panes').addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.pane.drag-over').forEach(x => x.classList.remove('drag-over')); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('imp').hidden) $('imp').hidden = true; });

if (!lib.some(o => o.id === sel)) sel = lib[0].id;
renderAll(true);
})();
</script>
