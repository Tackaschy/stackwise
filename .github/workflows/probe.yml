name: NCBI probe
on:
  push:
    branches: [ncbi-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python probe.py
      - run: |
          git config user.name "stackwise-probe"; git config user.email "probe@users.noreply.github.com"
          git add out2 && git commit -m "probe results" && git push
